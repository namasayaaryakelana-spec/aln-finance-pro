<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8"/>

  <!-- Subtle Outer Ring -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Decorative Glowing Backdrop Circle -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  <!-- ALN Monogram Shield & Chart Path -->
  <!-- Letter A / Crest Polygon -->
  <path d="M 256 100 L 370 300 H 318 L 256 180 L 194 300 H 142 Z" fill="url(#emeraldGrad)"/>
  
  <!-- Financial Growth Bar Overlay (Subtle L-Shape / N) -->
  <path d="M 200 360 L 256 270 L 312 330 L 380 210 L 400 230 L 312 360 L 256 300 L 200 380 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Bottom Accent Dot / Emerald Star -->
  <circle cx="256" cy="400" r="14" fill="#34D399"/>
</svg>
