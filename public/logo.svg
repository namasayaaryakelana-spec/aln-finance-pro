<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Left Ribbon Stem Gradient (Cyan to Sky Blue) -->
    <linearGradient id="leftStemGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Top Fold Transition Gradient -->
    <linearGradient id="topFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>

    <!-- Right Ribbon Stem Gradient (Royal Blue to Deep Azure) -->
    <linearGradient id="rightStemGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="60%" stop-color="#0034A6"/>
      <stop offset="100%" stop-color="#001F70"/>
    </linearGradient>

    <!-- Crossbar Arch Ribbon Gradient (Cyan Glow Wave) -->
    <linearGradient id="archRibbonGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="40%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D Layer Depth -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#050B14" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 1. Right Back Ribbon Stem -->
    <path d="M 288,72 L 406,380 C 420,416 394,440 365,440 L 322,440 C 302,440 286,428 276,404 L 246,330 L 288,72 Z"
          fill="url(#rightStemGrad)" filter="url(#shadow3d)" />

    <!-- 2. Top Apex Fold Piece -->
    <path d="M 252,65 C 265,65 277,67 288,72 L 235,200 L 195,200 L 252,65 Z"
          fill="url(#topFoldGrad)" />

    <!-- 3. Sweeping Crossbar Arch Ribbon -->
    <path d="M 125,370 C 160,290 220,235 295,235 C 342,235 385,260 415,305 C 418,310 410,325 398,342 C 368,382 320,402 270,378 C 220,354 175,360 148,392 C 136,406 120,388 125,370 Z"
          fill="url(#archRibbonGrad)" filter="url(#shadow3d)" />

    <!-- 4. Left Front Ribbon Stem (Overlapping with Negative Space Gap) -->
    <path d="M 252,65 C 265,65 277,67 288,72 L 152,410 C 142,434 116,440 92,430 C 72,422 66,396 78,368 L 226,78 C 233,69 242,65 252,65 Z"
          fill="url(#leftStemGrad)" filter="url(#shadow3d)" />

    <!-- Crisp Negative Space White/Transparent Separator Line -->
    <path d="M 226,78 L 152,410" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 130,375 C 190,270 270,238 385,278" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" fill="none" />
  </g>
</svg>