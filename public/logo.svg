<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Left Ribbon Leg (Cyan to Sky Blue) -->
    <linearGradient id="optELeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <!-- Right Ribbon Leg (Royal Blue to Deep Azure) -->
    <linearGradient id="optERight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>

    <!-- Sweeping Arc Ribbon Bridge (Cyan Arch) -->
    <linearGradient id="optEArch" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <filter id="shadowOptE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#050B14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadowOptE)">
    <!-- Right Leg -->
    <polygon points="295,105 402,410 327,410 255,245 272,160" fill="url(#optERight)" />
    
    <!-- Left Leg -->
    <polygon points="110,410 242,105 295,105 230,250 185,410" fill="url(#optELeft)" />

    <!-- Sweeping Arc Ribbon Bridge -->
    <polygon points="145,335 256,235 367,335 332,365 256,285 180,365" fill="url(#optEArch)" />

    <!-- Subtle negative space separation lines -->
    <line x1="242" y1="105" x2="185" y2="410" stroke="#FFFFFF" stroke-width="3" opacity="0.3" />
    <path d="M 145,335 C 200,285 312,285 367,335" stroke="#FFFFFF" stroke-width="3" opacity="0.3" fill="none" />
  </g>
</svg>