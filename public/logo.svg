<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="alnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>

    <!-- Cyan to Electric Blue Gradient for Main A Body -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Electric Blue to Dark Blue Gradient for Right Leg Accent -->
    <linearGradient id="accentBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0.2"/>
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>

    <!-- Bright Cyan Glow Gradient for Crossbar Chevron -->
    <linearGradient id="brightCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Solid Background with Rounded Corners -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#alnBgGrad)"/>

  <!-- Subtle Ambient Glow Circle Behind Icon -->
  <circle cx="256" cy="256" r="160" fill="#00F2FE" opacity="0.06" filter="url(#cyanGlow)"/>

  <!-- Modern Geometric A Symbol -->
  <g transform="translate(0, 10)">
    <!-- Left Main Diagonal Stem -->
    <path d="M 128 392 L 238 112 C 245 94, 267 94, 274 112 L 308 198 L 222 392 H 128 Z" fill="url(#cyanBlueGrad)"/>

    <!-- Right Outer Diagonal Stem (Overlapping Layer) -->
    <path d="M 274 112 L 384 392 H 290 L 246 278 L 308 198 Z" fill="url(#accentBlueGrad)"/>

    <!-- Center Upward Dynamic Chevron Crossbar -->
    <path d="M 184 324 L 256 244 L 328 324 L 296 348 L 256 304 L 216 348 Z" fill="url(#brightCyanGrad)"/>
  </g>
</svg>
